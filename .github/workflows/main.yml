name: Build Executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build on Linux ARM
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv python install 3.12
          # This installs everything including the git/url dependencies
          uv pip install --break-system-packages pyinstaller . 

      - name: Build with PyInstaller
        run: |
          # We include hidden imports for the specific libs in your toml
          pyinstaller --onefile \
            --name rpi-voice-assistant \
            --collect-all kittentts \
            --hidden-import openai \
            --hidden-import sounddevice \
            --hidden-import vosk \
            --hidden-import stt_lib \
            main_llama.py
            
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi-voice-assistant-bin
          path: dist/rpi-voice-assistant

  release:
    name: Create Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: rpi-voice-assistant-bin
          path: ./release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          body: |
            ### 🚀 Raspberry Pi Voice Assistant
            
            **Run Command:**
            ```bash
            chmod +x rpi-voice-assistant
            ./rpi-voice-assistant "Your/Model-Name:Quant"
            ```
            *Ensure llama-server is installed at `/home/pi/llama.cpp/build/bin/llama-server`.*
          files: ./release-files/rpi-voice-assistant
