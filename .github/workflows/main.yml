name: Build Executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build on Linux ARM
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # This installs deps from pyproject.toml plus the local project
          pip install . 

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile \
            --name rpi-voice-assistant \
            --collect-all kittentts \
            --hidden-import openai \
            --hidden-import soundfile \
            main_llama.py
            
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi-voice-assistant-bin
          path: dist/rpi-voice-assistant

  release:
    name: Create Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: rpi-voice-assistant-bin
          path: ./release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          body: |
            Automated build for Raspberry Pi.
            
            Ensure llama-server is installed and in PATH
            Ensure the VOSK model is downloaded and in the same directory as the executable - `wget https://alphacephei.com/vosk/models/vosk-model-en-us-0.22-lgraph.zip && unzip vosk-model-en-us-0.22-lgraph.zip` 


            **How to run:**
            1. `chmod +x rpi-voice-assistant`
            2. `./rpi-voice-assistant "LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q8_0"` (or other Hugging Face llama.cpp model)
            
          files: ./release-files/rpi-voice-assistant
